name: Generate Public URL Index

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-url-index:
    name: Generate URL Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate public URL index
        run: |
          node scripts/generate-url-index.js

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md domains/ brands/

          if git diff --cached --quiet; then
            echo "No URL index changes detected."
          else
            git commit -m "chore: update public URL index"
            git push
          fi
